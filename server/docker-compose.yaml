
services:
  postgres:
    image: postgres:18
    container_name: quiz-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quizapp
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.4
    container_name: quiz-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data